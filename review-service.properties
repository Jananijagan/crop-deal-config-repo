spring.application.name=review-service
server.port=8092
spring.datasource.url=${REVIEW_DB_URL:jdbc:mysql://localhost:3306/cropdeal_review_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
jwt.secret=${JWT_SECRET:CropDealJwtSecretKey2026SecureValue1234567890}
internal.api.key=${INTERNAL_API_KEY:CropDealInternalKey2026SecureValue123456}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
