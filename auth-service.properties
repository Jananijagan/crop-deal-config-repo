spring.application.name=auth-service
server.port=8088

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

cropdeal.admin.email=${CROPDEAL_ADMIN_EMAIL:admin@cropdeal.com}
cropdeal.admin.password=${CROPDEAL_ADMIN_PASSWORD:Admin@123}

jwt.secret=${JWT_SECRET:CropDealJwtSecretKey2026SecureValue1234567890}
internal.api.key=${INTERNAL_API_KEY:CropDealInternalKey2026SecureValue123456}
server.address=0.0.0.0
